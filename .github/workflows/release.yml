name: Release

# Publishes to npm with provenance when a vX.Y.Z tag equal to the package.json version is pushed.
# Controls: only maintainers can create v* tags (repository ruleset); the job runs in the "npm" environment,
# which needs a maintainer's approval and only accepts v* tags. Authentication is npm Trusted Publishing (OIDC):
# npmjs.com trusts codespace-ao/brisa-sdk-js, release.yml, environment npm; there is no long-lived npm token anywhere.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag is the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: npm with trusted publishing support (11.5.1 or later)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Publish to npm (OIDC, with provenance)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "brisa-sdk@$v" version >/dev/null 2>&1; then echo "already published: $v"; exit 0; fi
          npm publish --provenance --access public
      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
