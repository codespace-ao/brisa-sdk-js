name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, testes (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integração (sandbox)
    # só corre quando o repositório tem a chave de sandbox e o endereço configurados
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    env:
      BRISA_API_KEY: ${{ secrets.BRISA_API_KEY }}
      BRISA_API_URL: ${{ vars.BRISA_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration
